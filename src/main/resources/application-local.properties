spring.profiles.active=local
account.switch-name=virtual-account-manager
account.inject-dev-error-message=true
server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5432/virtualaccountsdb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-bean-definition-overriding=true
server.servlet.context-path=/ca
spring.application.name=virtual-account-manager
service.name=virtual-account-manager
management.health.redis.enabled=false

spring.jpa.open-in-view=false

#metrix
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
wrappers.prometheus.enable=true

opentracing.jaeger.const-sampler.decision=true
opentracing.jaeger.enabled=false
opentracing.jaeger.log-spans=false

#logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR

#logging.level.root=DEBUG

#AES Properties
aes.salt=${AES_SALT:}
aes.passphrase=${AES_PASSPHRASE:}
aes.init-vector=${AES_INIT_VECTOR:}

#spring.cloud.consul.enabled=false

#kafka
kafka.notify-topic=NOTIFY_ALERT_REQ_TOPIC
kafka.default-topic=NOTIFY_ALERT_REQ_TOPIC

#Kafka settings
spring.kafka.consumer.group-id=ca-group-1
kafka.bootstrap-server=localhost:9092
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=latest
kafka.listen.auto.start=true
spring.kafka.consumer.kafka-concurrent-size=5

#############RETRY PROPERTIES################
retry.count=3
retry.delay=6000
retry.initial-interval=60000
retry.interval-multiplier=1
retry.max-interval=300000
#############################################

#flyway
spring.flyway.enabled=true
flyway.enabled=true
flyway.baseline-on-migrate=true

management.endpoint.health.show-details=always

#======================================================
#SPRING BOOT ADMIN SERVER CONFIGURATION
#=======================================================
spring.boot.admin.enabled=true

spring.security.user.name=admin
spring.security.user.password=admin

#configs to connect to a secured server
spring.boot.admin.client.url=http://localhost:9091/admin-server
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=${ADMIN_CLIENT_PASSWORD:}

#configs to give secured server info
spring.boot.admin.client.instance.metadata.user.name=${spring.security.user.name}
spring.boot.admin.client.instance.metadata.user.password=${spring.security.user.password}
spring.boot.admin.routes.endpoints=env, metrics, trace, jolokia, info, configprops

#redis
# Redis isn't on the classpath; use the in-memory cache locally.
spring.cache.type=simple
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=60000
spring.redis.database=0
spring.cache.redis.cache-null-values=false

#Keys
account.secret-key=${ACCOUNT_SECRET_KEY:}
